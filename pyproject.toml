[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcutforge"
version = "0.1.0"
description = "Build and validate Apple Shortcuts from typed JSON plans"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
shortcutforge = "shortcutforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shortcutforge = ["data/*.json", "data/*.md", "data/*LICENSE"]

[tool.setuptools.exclude-package-data]
shortcutforge = ["data/scpl_macos_2.3.1_outactions.json"]
